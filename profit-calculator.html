<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit Calculator – Calculate Net Business Profit 2026</title>
    <meta name="description" content="Calculate your net business profit instantly. Free tool for small businesses to track revenue and costs.">
    
    <style>
        :root {
            --primary: #0284c7; /* Sky Blue */
            --primary-hover: #0369a1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 { font-size: 1.8rem; color: #0f172a; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1); }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .result-card {
            margin-top: 30px;
            display: none;
            background: #f0f9ff;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #bae6fd;
            text-align: center;
        }
        .res-value { font-size: 2.5rem; font-weight: 800; color: var(--primary); margin: 10px 0; }

        .info-section { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 25px; font-size: 0.9rem; color: #64748b; }
        
        footer { text-align: center; margin-top: 40px; color: #94a3b8; font-size: 0.85rem; }
        footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Profit Calculator</h1>
    <p class="subtitle">Quickly track your business financial health.</p>

    <div class="input-group">
        <label>Total Revenue ($)</label>
        <input type="number" id="revenue" placeholder="e.g. 10000">
    </div>

    <div class="input-group">
        <label>Total Costs ($)</label>
        <input type="number" id="cost" placeholder="e.g. 6000">
    </div>

    <button class="btn" onclick="calculateProfit()">Calculate Net Profit</button>

    <div id="resultCard" class="result-card">
        <div>Your Net Profit:</div>
        <div class="res-value" id="profitValue">$0.00</div>
        <div id="profitLabel" style="font-weight: 600;">Money left after all expenses</div>
    </div>
