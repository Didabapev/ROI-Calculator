<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Random Number Generator – Pick a Number Online 2026</title>
    <meta name="description" content="Generate random numbers instantly. Set your range and get a fair, random result for giveaways, games, or research.">
    
    <style>
        :root {
            --primary: #8b5cf6; /* Purple */
            --primary-hover: #7c3aed;
            --bg: #f5f3ff;
            --card: #ffffff;
            --text: #1e293b;
            --border: #ddd6fe;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 60px auto;
            background: var(--card);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 { font-size: 1.8rem; color: #4c1d95; margin-bottom: 30px; }

        .range-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        label { display: block; font-weight: 600; margin-bottom: 10px; font-size: 0.9rem; color: #6b7280; }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.2rem;
            text-align: center;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn:hover { background: var(--primary-hover); transform: scale(1.02); }
        .btn:active { transform: scale(0.98); }

        .result-display {
            margin-top: 40px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fdfcff;
            border: 2px dashed var(--border);
            border-radius: 20px;
        }

        .number {
            font-size: 4rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 4px 6px rgba(139, 92, 246, 0.2);
        }

        footer { margin-top: 40px; font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h1>Random Picker</h1>
    
    <div class="range-inputs">
        <div>
            <label>Min Value</label>
            <input type="number" id="minVal" value="1">
        </div>
        <div>
            <label>Max Value</label>
            <input type="number" id="maxVal" value="100">
        </div>
    </div>

    <button class="btn" onclick="generateRandom()">Generate Number</button>

    <div class="result-display">
        <div class="number" id="result">?</div>
    </div>

    <footer>
        <p>© 2026 Web Tools Hub</p>
        <a href="index.html" style="color:var(--primary); text-decoration:none;">← Back to Main Hub</a>
    </footer>
</div>

<script>
    function generateRandom() {
        const min = parseInt(document.getElementById('minVal').value);
        const max = parseInt(document.getElementById('maxVal').value);
        const resElement = document.getElementById('result');

        if (min < max) {
            // Эффект анимации
            let counter = 0;
            const interval = setInterval(() => {
                resElement.innerText = Math.floor(Math.random() * (max - min + 1)) + min;
                counter++;
                if (counter > 10) {
                    clearInterval(interval);
                    const finalNum = Math.floor(Math.random() * (max - min + 1)) + min;
                    resElement.innerText = finalNum;
                }
            }, 50);
        } else {
            alert("Minimum must be less than Maximum!");
        }
    }
</script>
</body>
</html>
