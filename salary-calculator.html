<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Salary Calculator – Net Pay & Tax Estimator 2026</title>
    <meta name="description" content="Calculate your take-home pay after taxes. Simple and fast salary calculator for monthly and annual income analysis.">
    
    <style>
        :root {
            --primary: #1e40af; /* Deep Blue */
            --primary-hover: #1e3a8a;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            margin: 40px auto;
            background: var(--card);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 { font-size: 1.8rem; color: var(--primary); text-align: center; margin-bottom: 25px; }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1.1rem;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
            margin-top: 10px;
        }

        .result-box {
            margin-top: 30px;
            display: none;
            background: #f8fafc;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .res-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 1.1rem; }
        .res-total { font-weight: 800; color: #059669; font-size: 1.5rem; border-top: 1px solid #e2e8f0; padding-top: 12px; margin-top: 12px; }

        footer { text-align: center; margin-top: 40px; color: #64748b; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Salary Calculator</h1>
    
    <div class="input-group">
        <label>Gross Salary (Before Tax)</label>
        <input type="number" id="grossSalary" placeholder="e.g. 5000">
    </div>

    <div class="input-group">
        <label>Tax Rate (%)</label>
        <input type="number" id="taxRate" value="13" placeholder="13">
    </div>

    <button class="btn" onclick="calculateSalary()">Calculate Take-Home Pay</button>

    <div id="resultBox" class="result-box">
        <div class="res-row"><span>Gross Income:</span> <span id="grossRes">$0.00</span></div>
        <div class="res-row"><span>Tax Amount:</span> <span id="taxRes">$0.00</span></div>
        <div class="res-row res-total"><span>Net Salary (Take-Home):</span> <span id="netRes">$0.00</span></div>
    </div>
</div>

<footer>
    <p>© 2026 Web Tools Hub | <a href="index.html" style="color:var(--primary); text-decoration:none;">Back to Hub</a></p>
</footer>

<script>
    function calculateSalary() {
        const gross = parseFloat(document.getElementById('grossSalary').value);
        const rate = parseFloat(document.getElementById('taxRate').value);

        if (gross > 0 && rate >= 0) {
            const taxAmount = gross * (rate / 100);
            const netSalary = gross - taxAmount;

            document.getElementById('grossRes').innerText = '$' + gross.toLocaleString();
            document.getElementById('taxRes').innerText = '$' + taxAmount.toLocaleString();
            document.getElementById('netRes').innerText = '$' + netSalary.toLocaleString();
            document.getElementById('resultBox').style.display = 'block';
        } else {
            alert("Please enter valid numbers.");
        }
    }
</script>
</body>
</html>
