<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Calorie Calculator – Daily Caloric Needs & Weight Loss 2026</title>
    <meta name="description" content="Calculate your daily calorie needs based on your age, weight, and activity level. Accurate BMR & TDEE results for weight loss or maintenance.">
    
    <style>
        :root {
            --primary: #f97316; /* Orange */
            --primary-hover: #ea580c;
            --bg: #fff7ed;
            --card: #ffffff;
            --text: #1e293b;
            --border: #fed7aa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--card);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 { font-size: 1.8rem; color: #7c2d12; text-align: center; margin-bottom: 24px; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .result-box {
            margin-top: 30px;
            display: none;
            background: #fffaf5;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .calories { font-size: 2.5rem; font-weight: 800; color: var(--primary); }
        .info-text { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 20px; font-size: 0.9rem; color: #7c2d12; }
    </style>
</head>
<body>

<div class="container">
    <h1>Calorie Calculator</h1>
    
    <div class="input-grid">
        <div>
            <label>Gender</label>
            <select id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>
        <div>
            <label>Age</label>
            <input type="number" id="age" placeholder="25">
        </div>
        <div>
            <label>Weight (kg)</label>
            <input type="number" id="weight" placeholder="70">
        </div>
        <div>
            <label>Height (cm)</label>
            <input type="number" id="height" placeholder="175">
        </div>
        <div style="grid-column: span 2;">
            <label>Activity Level</label>
            <select id="activity">
                <option value="1.2">Sedentary (Little/no exercise)</option>
                <option value="1.375">Light (1-3 days/week)</option>
                <option value="1.55">Moderate (3-5 days/week)</option>
                <option value="1.725">Active (6-7 days/week)</option>
            </select>
        </div>
    </div>

    <button class="btn" onclick="calculateCalories()">Calculate Daily Calories</button>

    <div id="resultBox" class="result-box">
        <p>To maintain your weight, you need:</p>
        <div class="calories" id="caloriesOutput">2000</div>
        <p>Calories per day</p>
    </div>

    <section class="info-text">
        <h3>How it works</h3>
        <p>We use the Mifflin-St Jeor Equation to estimate your Basal Metabolic Rate (BMR) and then apply an activity multiplier to find your TDEE (Total Daily Energy Expenditure).</p>
    </section>
</div>

<script>
    function calculateCalories() {
        const gender = document.getElementById('gender').value;
        const age = parseInt(document.getElementById('age').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const height = parseFloat(document.getElementById('height').value);
        const activity = parseFloat(document.getElementById('activity').value);

        if (age > 0 && weight > 0 && height > 0) {
            let bmr;
            if (gender === 'male') {
                bmr = 10 * weight + 6.25 * height - 5 * age + 5;
            } else {
                bmr = 10 * weight + 6.25 * height - 5 * age - 161;
            }
            
            const tdee = Math.round(bmr * activity);
            document.getElementById('caloriesOutput').innerText = tdee;
            document.getElementById('resultBox').style.display = 'block';
        } else {
            alert("Please fill in all fields correctly.");
        }
    }
</script>
</body>
</html>
