<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Tip Calculator – Split Bills Fast & Easy 2026</title>
    <meta name="description" content="Quickly calculate tips and split the bill among friends. Easy to use online tip calculator for mobile and desktop.">
    
    <style>
        :root {
            --primary: #f59e0b; /* Amber */
            --primary-hover: #d97706;
            --bg: #fffbeb;
            --card: #ffffff;
            --text: #1e293b;
            --border: #fde68a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            background: var(--card);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 { font-size: 1.6rem; color: #92400e; text-align: center; margin-bottom: 25px; }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1.1rem;
        }

        .tip-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .tip-btn {
            padding: 10px;
            background: #fef3c7;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .tip-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .result-box {
            margin-top: 30px;
            background: #fffdf2;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .res-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.1rem; }
        .res-row.total { font-size: 1.4rem; font-weight: 800; color: var(--primary); border-top: 1px solid var(--border); pt: 10px; }

        footer { text-align: center; margin-top: 40px; color: #94a3b8; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Tip Calculator</h1>
    
    <div class="input-group">
        <label>Bill Amount ($)</label>
        <input type="number" id="bill" placeholder="0.00" oninput="calculate()">
    </div>

    <label>Tip Percentage (%)</label>
    <div class="tip-options">
        <button class="tip-btn" onclick="setTip(10, this)">10%</button>
        <button class="tip-btn active" onclick="setTip(15, this)">15%</button>
        <button class="tip-btn" onclick="setTip(20, this)">20%</button>
    </div>

    <div class="input-group">
        <label>Number of People</label>
        <input type="number" id="people" value="1" min="1" oninput="calculate()">
    </div>

    <div class="result-box">
        <div class="res-row"><span>Tip Amount:</span> <span id="tipResult">$0.00</span></div>
        <div class="res-row total"><span>Per Person:</span> <span id="perPersonResult">$0.00</span></div>
    </div>
</div>

<footer>
    <p>© 2026 Web Tools Hub</p>
    <a href="index.html" style="color: var(--primary); text-decoration: none;">← Back to Main Hub</a>
</footer>

<script>
    let currentTip = 15;

    function setTip(percent, btn) {
        currentTip = percent;
        document.querySelectorAll('.tip-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        calculate();
    }

    function calculate() {
        const bill = parseFloat(document.getElementById('bill').value) || 0;
        const people = parseInt(document.getElementById('people').value) || 1;
        
        const tipTotal = bill * (currentTip / 100);
        const total = bill + tipTotal;
        const perPerson = total / people;

        document.getElementById('tipResult').innerText = '$' + tipTotal.toFixed(2);
        document.getElementById('perPersonResult').innerText = '$' + perPerson.toFixed(2);
    }
</script>
</body>
</html>
