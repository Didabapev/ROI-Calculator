<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Word Counter – Count Words, Characters & Reading Time 2026</title>
    <meta name="description" content="Fast and free online word counter. Count words, characters, sentences, and estimate reading time instantly. Secure and private text analysis.">
    
    <style>
        :root {
            --primary: #0ea5e9; /* Sky Blue */
            --primary-hover: #0284c7;
            --bg: #f0f9ff;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: var(--card);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 { font-size: 1.8rem; text-align: center; margin-bottom: 25px; color: #0369a1; }

        textarea {
            width: 100%;
            height: 300px;
            padding: 20px;
            border: 2px solid var(--border);
            border-radius: 16px;
            font-size: 1.1rem;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        textarea:focus { border-color: var(--primary); outline: none; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-value { display: block; font-size: 1.5rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }

        .info-section { font-size: 0.9rem; color: #64748b; border-top: 1px solid var(--border); padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Word Counter</h1>
    
    <textarea id="textInput" placeholder="Paste your text here..." oninput="count()"></textarea>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-value" id="wordCount">0</span>
            <span class="stat-label">Words</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="charCount">0</span>
            <span class="stat-label">Characters</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="readTime">0m</span>
            <span class="stat-label">Reading Time</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="sentenceCount">0</span>
            <span class="stat-label">Sentences</span>
        </div>
    </div>

    <div class="info-section">
        <p><strong>Private Analysis:</strong> Your text is never uploaded to any server. All processing happens locally in your browser to ensure 100% privacy.</p>
    </div>
</div>

<script>
    function count() {
        const text = document.getElementById('textInput').value.trim();
        
        // Words
        const words = text ? text.split(/\s+/).length : 0;
        document.getElementById('wordCount').innerText = words;

        // Characters
        document.getElementById('charCount').innerText = text.length;

        // Sentences
        const sentences = text ? text.split(/[.!?]+\s/).filter(Boolean).length : 0;
        document.getElementById('sentenceCount').innerText = sentences;

        // Reading Time (Avg 200 words per minute)
        const readTime = Math.ceil(words / 200);
        document.getElementById('readTime').innerText = readTime + 'm';
    }
</script>
</body>
</html>
